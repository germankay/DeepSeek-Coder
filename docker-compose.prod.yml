version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybercode-studio/api-server:latest
    container_name: cybercode-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - API_KEY=${API_KEY:-cybercode-secret-key-change-in-production}
      - ENVIRONMENT=production
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 32G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    command: python3 demo/app.py
    container_name: cybercode-demo-prod
    restart: always
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    depends_on:
      - api

volumes:
  model_cache:
    driver: local
